plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    accessWidenerPath = file('src/main/resources/night.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Build metadata for the in-game watermark and main menu, taken from this checkout.
def gitValue = { List<String> args, String fallback ->
    try {
        def result = providers.exec {
            commandLine(['git'] + args)
            ignoreExitValue = true
        }
        def text = result.standardOutput.asText.get().trim()
        return (result.result.get().exitValue == 0 && !text.isEmpty()) ? text : fallback
    } catch (Exception ignored) {
        return fallback
    }
}

def buildVersion = project.version.toString()
def buildMcVersion = project.minecraft_version.toString()
def buildHash = (findProperty('buildHash') ?: gitValue(['rev-parse', '--short', 'HEAD'], 'unknown')).toString()
def buildRevision = (findProperty('buildRevision') ?: gitValue(['rev-list', '--count', 'HEAD'], '0')).toString()
def buildDate = (findProperty('buildDate') ?: java.time.LocalDate.now().toString()).toString()

def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo/java')

def generateBuildInfo = tasks.register('generateBuildInfo') {
    def outputDir = buildInfoDir
    def versionValue = buildVersion
    def mcVersionValue = buildMcVersion
    def hashValue = buildHash
    def revisionValue = buildRevision
    def dateValue = buildDate
    outputs.dir(outputDir)
    inputs.property('version', versionValue)
    inputs.property('hash', hashValue)
    inputs.property('revision', revisionValue)
    inputs.property('date', dateValue)
    doLast {
        def file = outputDir.get().file('night/BuildConstants.java').asFile
        file.parentFile.mkdirs()
        file.text = """package night;

/** Generated by Gradle from this git checkout -- do not edit. */
public final class BuildConstants {
    public static final String MOD_NAME = "Night";
    public static final String MOD_ID = "night";
    public static final String MOD_VERSION = "${versionValue}";
    public static final String MINECRAFT_VERSION = "${mcVersionValue}";
    public static final String GIT_HASH = "${hashValue}";
    public static final String GIT_REVISION = "${revisionValue}";
    public static final String BUILD_DATE = "${dateValue}";

    private BuildConstants() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir(buildInfoDir)
tasks.named('compileJava') { dependsOn generateBuildInfo }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs << '-nowarn'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn generateBuildInfo }

tasks.register('printCompileClasspath') {
    doLast {
        println sourceSets.main.compileClasspath.asPath
    }
}
